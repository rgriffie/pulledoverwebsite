name: Restore Chakra ROSA and HCI pages
on:
  push:
    paths:
      - .github/workflows/restore-large-pages.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify existing public site pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rosa hci
          for page in rosa hci; do
            curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
              "https://rishabmohandoss.github.io/aichakra.io-v2/$page/" \
              -o "$page/index.html"
          done
          test "$(git hash-object rosa/index.html)" = "0edfd04ba8bce5125af660f504bcccfb2c7c72b9"
          test "$(git hash-object hci/index.html)" = "18e1a862389e2e01e03edad6fa114b567c698697"
      - name: Commit verified pages to Roz's repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosa/index.html hci/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Complete migration of ROSA and HCI large pages"
          git push origin HEAD:main
